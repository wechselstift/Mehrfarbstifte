name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      # Repository inklusive kompletter Git-Historie laden
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Python bereitstellen
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Zuletzt geänderten Artikel ermitteln
      # und index.html im Build-Verzeichnis aktualisieren
      - name: Update last article
        run: |
          python scripts/update_last_article.py

      # GitHub Pages vorbereiten
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Fertige Website hochladen
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
